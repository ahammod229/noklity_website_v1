<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Storefront</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: 'rgb(var(--color-primary-rgb) / <alpha-value>)',
              secondary: 'rgb(var(--color-secondary-rgb) / <alpha-value>)',
              accent: 'rgb(var(--color-secondary-rgb) / <alpha-value>)',
              background: 'rgb(var(--background-current-rgb) / <alpha-value>)',
              foreground: 'rgb(var(--text-current-rgb) / <alpha-value>)',
              popover: 'rgb(var(--surface-current-rgb) / <alpha-value>)',
              'popover-foreground': 'rgb(var(--text-current-rgb) / <alpha-value>)',
              border: 'rgb(var(--border-current-rgb) / <alpha-value>)',
            }
          }
        }
      }
    </script>
    <script>
      (function applyInitialTheme() {
        try {
          var stored = window.localStorage.getItem('noklity-theme-mode');
          var theme = stored === 'dark' ? 'dark' : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
    <script>
      (function applyInitialTenantBranding() {
        try {
          var raw = window.localStorage.getItem('noklity_tenant_config_v1');
          if (!raw) return;
          var parsed = JSON.parse(raw);
          if (parsed && parsed.brandName) {
            document.title = String(parsed.brandName);
          }
        } catch (error) {
          // Keep static fallback title.
        }
      })();
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--noklity-bg, #ffffff);
        color: var(--noklity-text, #111827);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.90.1"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
