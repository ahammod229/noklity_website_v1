    <script>
      (function applyInitialFavicon() {
        var CACHE_KEY = 'noklity_public_site_config_v1';
        var DEFAULT_FAVICON = '/favicon.svg';

        var inferType = function (href) {
          var normalized = String(href || '').toLowerCase().split('?')[0].split('#')[0];
          if (normalized.endsWith('.svg')) return 'image/svg+xml';
          if (normalized.endsWith('.png')) return 'image/png';
          if (normalized.endsWith('.ico')) return 'image/x-icon';
          if (normalized.endsWith('.webp')) return 'image/webp';
          if (normalized.endsWith('.jpg') || normalized.endsWith('.jpeg')) return 'image/jpeg';
          return '';
        };

        var upsertLink = function (rel, href, type) {
          var selector = 'link[rel="' + rel + '"]';
          var link = document.head.querySelector(selector);
          if (!link) {
            link = document.createElement('link');
            link.setAttribute('rel', rel);
            document.head.appendChild(link);
          }
          link.setAttribute('href', href);
          if (type) {
            link.setAttribute('type', type);
          } else {
            link.removeAttribute('type');
          }
        };

        try {
          var raw = window.localStorage.getItem(CACHE_KEY);
          var parsed = raw ? JSON.parse(raw) : null;
          var faviconUrl =
            parsed && typeof parsed.faviconUrl === 'string' && parsed.faviconUrl.trim()
              ? parsed.faviconUrl.trim()
              : DEFAULT_FAVICON;
          var iconType = inferType(faviconUrl);

          upsertLink('icon', faviconUrl, iconType);
          upsertLink('shortcut icon', faviconUrl, iconType);
          upsertLink('apple-touch-icon', faviconUrl, '');
        } catch (error) {
          var defaultType = inferType(DEFAULT_FAVICON);
          upsertLink('icon', DEFAULT_FAVICON, defaultType);
          upsertLink('shortcut icon', DEFAULT_FAVICON, defaultType);
          upsertLink('apple-touch-icon', DEFAULT_FAVICON, '');
        }
      })();
    </script>
    <script>
      (function redirectToPreferredHost() {
        try {
          var host = window.location.hostname.toLowerCase();
          var preferred = 'www.noklity.com';
          var redirectHosts = {
            'noklity.com': true,
            'noklity-fd082.web.app': true,
            'noklity-fd082.firebaseapp.com': true
          };

          if (redirectHosts[host]) {
            var nextUrl = 'https://' + preferred + window.location.pathname + window.location.search + window.location.hash;
            window.location.replace(nextUrl);
          }
        } catch (error) {
          // Ignore redirect errors and let the app load normally.
        }
      })();
    </script>

    <script>
      (function applyInitialTheme() {
        try {
          var stored = window.localStorage.getItem('noklity-theme-mode');
          var theme = stored === 'dark' ? 'dark' : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
